name: Compilar SensiAura en macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descargar proyecto del repositorio
        uses: actions/checkout@v4

      - name: Preparar código fuente
        run: |
          unzip -q 3105-main-redesign.zip
          find 3105-main-src -maxdepth 2 -name '*.xcodeproj' -print

      - name: Compilar aplicación unsigned
        run: |
          mkdir -p build/App
          xcodebuild \
            -project 3105-main-src/ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PWD/build/App" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar IPA unsigned
        run: |
          mkdir -p build/Payload
          cp -R build/App/3105.app build/Payload/
          (cd build && zip -qr ThreeOneOSFive-unsigned.ipa Payload)

      - name: Publicar IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned
          path: build/ThreeOneOSFive-unsigned.ipa
